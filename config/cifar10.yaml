# Config of the CIFAR-10 image classification task (Phase C.2 Task 7, Phase C.5 Task 9.10). Per-run choices on the
# command line:  python train.py --config config/cifar10.yaml --set model.n_heads=1
# Model and the other train settings as config/sudoku_rrn.yaml (JayR); from Hyper-SET (Table 9, 10, configs/task/ic.yaml):
# d_model 512 (models/tasks/cifar.py), patch 8, batch 128, 200 epochs, cosine lr with 5 warmup epochs, min lr = lr / 100.
task: cifar10                # registry name: dataset (data/) and model (models/tasks/)
device: auto                 # auto | cuda | cpu
dtype: float32

model:                       # passed to build_model(task, **model)
  mode: et                   # et | forced                 (per run, --set)
  backward: unroll           # unroll | ift                (per run, --set)
  n_heads: 8                 # 1 | 8                       (per run, --set)
  tie_mode: orbit            # orbit | hard (ablation: no W_v, W_o; exact gradient of E) (per run, --set)
  step_size: 0.1
  step_mode: fixed           # fixed (step_size) | adaptive (0.95 * 2 / L per step and sample) (per run, --set)
  max_gradient_steps: 6      # T: steps of the loop in training (unroll) and in fixed_steps inference

data:
  batch_size: 128            # Hyper-SET
  test_batch_size: 500
  test_size: null            # test samples per split; null = the whole split (10,000)
  num_workers: 4             # DataLoader workers of the train set (augmentation on the CPU)

train:
  schedule: epoch            # epoch: one pass over the train set per epoch, DataLoader(shuffle=True)
  epochs: 200                # Hyper-SET
  optimizer: adamw
  lr: 1.0e-4                 # peak lr of the cosine schedule
  lr_schedule: cosine        # none | cosine (linear warmup, then cosine decay to min_lr)
  warmup: 5                  # warmup length, in epochs (Hyper-SET: 5)
  min_lr: 1.0e-6             # lr / 100, as Hyper-SET (1e-3 -> 1e-5)
  betas: [0.9, 0.95]
  weight_decay: 0.1
  test_every: 2              # in epochs
  tie_self: 1.0              # coefficient of R_self in the loss (tie_mode orbit)
  tie_cross: 1.0             # coefficient of R_cross in the loss (tie_mode orbit)
  clip_grad: true            # clip the total L2 norm of the gradient before optimizer.step()
  clip_grad_norm: 1.0        # max norm when clip_grad is true
  mu_penalty: 1.0            # coefficient of max(0, mu - mu_max)^2 in the loss (Theorem 1: mu < 1/2); 0 = off
  mu_max: 0.45               # threshold of the mu penalty (below 1/2 for a margin)
  converge_steps: 100        # test_id: one pass of this many steps; loss / metric read at max_gradient_steps (Task 6)
  converge_tol: 1.0e-5       # a sample converges if local dist < this within converge_steps
  converge_frac: 0.99        # convergence_checkpoint.pt (unroll runs) once this fraction of test_id converges

wandb:
  project: ebm-cifar10
  entity: null               # null: personal account
  mode: online               # online | offline | disabled (test runs: --set wandb.mode=disabled)
