# Config of the inverse task (Phase C.5, Task 2). Per-run choices go on the command line:
#   python train.py --config config/inverse.yaml --set model.mode=forced model.backward=ift
# Numbers from Phase-C.2 (train: Adam 1e-4, 10k iterations, test ID / OOD every ~100 steps) and Phase-C.4.
task: inverse                     # registry name: dataset (data/) and model (models/tasks/)
device: auto                 # auto | cuda | cpu
dtype: float32

model:                       # passed to build_model(task, **model)
  mode: et                   # et | forced                 (per run, --set)
  backward: unroll           # unroll | ift                (per run, --set)
  n_heads: 1                 # 1 | 8                       (per run, --set)
  tie_mode: orbit            # orbit | hard (ablation: no W_v, W_o; exact gradient of E) (per run, --set)
  step_size: 0.75
  max_gradient_steps: 16      # T: steps of the loop in training (unroll) and in fixed_steps inference

data:
  batch_size: null           # set at the small trial run (Task 9)
  test_batch_size: null
  test_size: null            # test samples per split; null = the whole split; toy splits are 1e7 long, set at Task 9

train:
  schedule: step             # step: new batches drawn on the fly, counted in iterations
  iterations: 10000
  optimizer: adam
  lr: 1.0e-4
  betas: [0.9, 0.99]
  weight_decay: 0.0
  test_every: 100            # test ID and OOD every this many iterations (steps)
  tie_self: null             # coefficient of R_self in the loss (Task 5.2)
  tie_cross: null            # coefficient of R_cross in the loss (Task 5.2)
  clip_grad: false           # clip the total L2 norm of the gradient before optimizer.step() (off by default)
  clip_grad_norm: 1.0        # max norm when clip_grad is true
  mu_penalty: 0.0            # coefficient of max(0, mu - mu_max)^2 in the loss (Theorem 1: mu < 1/2); 0 = off
  mu_max: 0.45               # threshold of the mu penalty (below 1/2 for a margin)
  converge_steps: 100        # test_id: one pass of this many steps; loss / metric read at max_gradient_steps (Task 6)
  converge_tol: 1.0e-5       # a sample converges if local dist < this within converge_steps
  converge_frac: 0.99        # convergence_checkpoint.pt (unroll runs) once this fraction of test_id converges

wandb:
  project: ebm-inverse
  entity: null               # null: personal account
  mode: online               # online | offline | disabled (test runs: --set wandb.mode=disabled)
